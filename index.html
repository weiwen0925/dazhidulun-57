<style>
:root{
  --bg:#f7f3ec;--text:#2c2416;--text2:#5a4e3a;--text-muted:#6B5B4B;
  --accent:#8b5e3c;--accentL:#c4956a;--accent-red:#8B2500;
  --gold:#b8860b;--goldL:#d4a84b;--gold-light:#C9A84C;
  --border:#d4c4a8;--border-light:#EDE8E0;--card:#fffdf7;
  --verseBg:#f0e8d8;--verseBd:#c4956a;
  --sbW:96px;--sbBg:#1e1a14;--sbText:#d4c4a8;
  --headGrad:linear-gradient(135deg,#2a2218 0%,#3d3225 50%,#2a2218 100%);
  --r:8px;--shadow:rgba(91,58,41,0.08);
}
*{box-sizing:border-box;}
html,body{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Serif TC","Source Han Serif TC","Songti TC",Georgia,serif;
  font-size:20px;line-height:1.85;
  -webkit-user-select:none;-moz-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
a{color:inherit;text-decoration:none;}

/* ── 側欄 ── */
#sb{position:fixed;left:0;top:0;width:var(--sbW);height:100vh;
  background:var(--sbBg);color:var(--sbText);z-index:100;
  display:flex;flex-direction:column;align-items:center;
  padding:0 0 16px;overflow-y:auto;scrollbar-width:none;}
#sb::-webkit-scrollbar{display:none;}
.sb-brand{position:sticky;top:0;width:100%;
  font-family:"Noto Sans TC",sans-serif;
  text-align:center;line-height:1.5;
  background:linear-gradient(to bottom,var(--sbBg) 80%,rgba(30,26,20,0));
  padding:14px 4px 12px;margin-bottom:8px;z-index:5;
  text-decoration:none;cursor:pointer;display:block;
  transition:color .25s;border-bottom:1px solid rgba(184,134,11,.25);}
.sb-brand:hover{color:var(--goldL);}
.sb-brand .sb-brand-line1{display:block;font-size:11px;letter-spacing:1.5px;opacity:.78;color:var(--gold);}
.sb-brand .sb-brand-line2{display:block;font-size:14px;font-weight:700;letter-spacing:2px;color:var(--goldL);margin-top:3px;}
.sb-brand .sb-brand-arrow{display:block;font-size:10px;opacity:.55;margin-top:3px;color:var(--gold);}
.sb-nav{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;margin-top:4px;}
.sb-item{display:flex;flex-direction:column;align-items:center;gap:3px;
  width:100%;padding:6px 4px;cursor:pointer;transition:background .2s;border-radius:6px;}
.sb-item:hover{background:rgba(184,134,11,.14);}
.sb-item.active{background:rgba(184,134,11,.22);box-shadow:0 0 12px rgba(184,134,11,.35) inset;}
.sb-circle{width:36px;height:36px;border-radius:50%;
  border:1.5px solid var(--gold);color:var(--goldL);
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans TC",sans-serif;font-size:16px;font-weight:600;}
.sb-item.active .sb-circle{background:var(--gold);color:#1e1a14;border-color:var(--goldL);}
.sb-label{font-family:"Noto Sans TC",sans-serif;font-size:11.5px;
  letter-spacing:.3px;opacity:.86;text-align:center;line-height:1.3;}

/* ── 漢堡 ── */
#sbToggle{display:none;position:fixed;left:12px;top:12px;z-index:130;
  width:42px;height:42px;border:none;border-radius:8px;
  background:var(--sbBg);color:var(--goldL);font-size:20px;cursor:pointer;}

/* ── main ── */
.main{margin-left:var(--sbW);}

/* ── Hero ── */
.site-hero{position:relative;overflow:hidden;
  background:var(--headGrad);color:#f3ead4;
  padding:78px 28px 64px;text-align:center;}
.site-hero::before{content:"般若";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);font-size:340px;font-weight:900;
  color:rgba(212,168,75,.04);pointer-events:none;white-space:nowrap;
  font-family:"Noto Serif TC",serif;}
.hero-content{position:relative;z-index:1;max-width:880px;margin:0 auto;}
.hero-tag{display:inline-block;font-family:"Noto Sans TC",sans-serif;
  font-size:13px;letter-spacing:4px;color:var(--goldL);
  border:1px solid rgba(212,168,75,.5);border-radius:20px;
  padding:5px 18px;margin-bottom:24px;}
.hero-title{font-size:56px;font-weight:900;letter-spacing:4px;
  color:#f5e6c0;margin:0 0 18px;}
.hero-subtitle{font-size:20px;color:var(--goldL);letter-spacing:2px;margin:0 0 20px;}
.hero-range{font-size:17px;color:#cdbb95;letter-spacing:1px;margin:0 0 10px;
  font-family:"Noto Sans TC",sans-serif;}
.hero-meta{font-size:18px;color:#bda978;letter-spacing:1px;
  font-family:"Noto Sans TC",sans-serif;}

/* ── 編者前言 ── */
.preface{max-width:860px;margin:46px auto 10px;padding:0 28px;}
.preface-title{font-size:30px;color:var(--accent);text-align:center;
  letter-spacing:6px;margin:0 0 26px;font-weight:700;}
.preface-title::after{content:"";display:block;width:60px;height:3px;
  background:var(--gold);margin:14px auto 0;border-radius:2px;}
.preface p{font-size:19px;line-height:2.1;color:var(--text2);margin:0 0 18px;text-align:justify;}

/* ── 總目錄 ── */
.toc-section{max-width:1100px;margin:40px auto 20px;padding:0 28px;}
.toc-title{font-size:34px;color:var(--accent);text-align:center;
  letter-spacing:8px;margin:0 0 10px;font-weight:700;}
.toc-title::after{content:"";display:block;width:70px;height:3px;
  background:var(--gold);margin:16px auto 0;border-radius:2px;}
.toc-desc{font-size:17px;color:var(--text-muted);text-align:center;
  letter-spacing:1px;margin:0 0 34px;font-family:"Noto Sans TC",sans-serif;}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
.toc-card{display:flex;gap:16px;align-items:flex-start;
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:20px 22px;cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  box-shadow:0 1px 4px var(--shadow);}
.toc-card:hover{transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(91,58,41,.14);border-color:var(--gold);}
.toc-num{flex:0 0 auto;width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--goldL));color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans TC",sans-serif;font-size:20px;font-weight:700;
  box-shadow:0 2px 8px rgba(184,134,11,.35);}
.toc-body{flex:1;}
.toc-name{font-size:19.5px;font-weight:700;color:var(--accent);line-height:1.5;margin-bottom:6px;}
.toc-sub{font-size:15px;color:var(--text-muted);line-height:1.6;
  font-family:"Noto Sans TC",sans-serif;}

/* ── 章節（品） ── */
.chapter{margin:56px 0 0;scroll-margin-top:20px;}
.ch-head{position:relative;background:var(--headGrad);color:#f3ead4;
  padding:46px 28px;text-align:center;overflow:hidden;}
.ch-head::after{content:"";display:block;width:80px;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:20px auto 0;}
.ch-pin{display:inline-block;font-family:"Noto Sans TC",sans-serif;
  font-size:13px;letter-spacing:4px;color:var(--goldL);
  border:1px solid rgba(212,168,75,.5);border-radius:16px;
  padding:4px 16px;margin-bottom:18px;}
.ch-name{font-size:38px;font-weight:900;letter-spacing:3px;color:#f5e6c0;margin:0 0 14px;}
.ch-sub{font-size:17px;color:var(--goldL);letter-spacing:1.5px;
  font-family:"Noto Sans TC",sans-serif;}
.ch-body{max-width:980px;margin:0 auto;padding:30px 28px 10px;}

/* ── 橋接 ── */
.bridge{background:linear-gradient(135deg,#fffdf5,#f5ecd8);
  border:1px solid var(--border);border-left:5px solid var(--gold);
  border-radius:10px;padding:18px 24px;margin:0 0 26px;
  box-shadow:0 2px 10px rgba(91,58,41,.06);}
.bridge-outro{border-left-color:var(--accentL);
  background:linear-gradient(135deg,#fdf8e8,#f2e6c8);
  margin-top:30px;margin-bottom:14px;}
.bridge-label{display:inline-block;font-family:"Noto Sans TC",sans-serif;
  font-size:12.5px;background:var(--gold);color:#fff;
  padding:3px 14px;border-radius:12px;letter-spacing:2.2px;margin-bottom:12px;}
.bridge-outro .bridge-label{background:var(--accent);}
.bridge p{margin:0;color:var(--text2);line-height:2.1;font-size:18.5px;text-align:justify;}

/* ── iframe ── */
.ch-frame{display:block;width:100%;border:0;background:#fffdf7;
  border:1px solid var(--border);border-radius:12px;
  box-shadow:0 4px 20px rgba(91,58,41,.1);margin:0 0 8px;min-height:180px;}

.next-link{display:inline-flex;align-items:center;gap:8px;
  font-family:"Noto Sans TC",sans-serif;font-size:17px;
  color:var(--accent);border:1px solid var(--gold);border-radius:24px;
  padding:9px 24px;margin:6px 0 8px;transition:background .2s,color .2s;cursor:pointer;}
.next-link:hover{background:var(--gold);color:#fff;}

/* ── 進度膠囊 ── */
.read-progress{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  z-index:120;background:rgba(30,26,20,.92);color:var(--gold);
  padding:9px 24px;border-radius:30px;border:1px solid rgba(184,134,11,.5);
  box-shadow:0 4px 18px rgba(0,0,0,.25);font-family:"Noto Sans TC",sans-serif;
  font-size:14px;letter-spacing:2px;display:flex;align-items:center;gap:12px;
  pointer-events:none;user-select:none;backdrop-filter:blur(6px);
  transition:opacity .45s ease,transform .45s ease;}
.read-progress.hide-near-end{opacity:0;transform:translateX(-50%) translateY(28px);}
.read-progress .rp-bar{width:148px;height:4px;background:rgba(212,196,168,.18);
  border-radius:2px;overflow:hidden;position:relative;}
.read-progress .rp-fill{position:absolute;top:0;left:0;bottom:0;
  background:linear-gradient(90deg,var(--gold),var(--goldL));width:0%;transition:width .3s;}
.read-progress .rp-pct{font-weight:600;min-width:38px;text-align:right;font-size:13px;}
.read-progress .rp-label{font-size:12px;opacity:.85;letter-spacing:4px;color:var(--goldL);}

/* ── 回頂 ── */
#backTop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;
  border-radius:50%;border:none;background:var(--accent);color:#fff;
  font-size:20px;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .3s;z-index:120;box-shadow:0 3px 12px rgba(0,0,0,.25);}
#backTop.show{opacity:.9;pointer-events:auto;}

/* ── 頁尾 ── */
.site-footer{margin-top:60px;background:var(--sbBg);color:#bda978;
  text-align:center;padding:34px 24px;font-size:15px;letter-spacing:1px;
  font-family:"Noto Sans TC",sans-serif;line-height:1.9;}

/* ── RWD ── */
@media(max-width:900px){
  #sb{transform:translateX(-100%);transition:transform .3s;}
  #sb.open{transform:translateX(0);}
  #sbToggle{display:block;}
  .main{margin-left:0;}
  .hero-title{font-size:40px;}.ch-name{font-size:30px;}
  .site-hero{padding:60px 20px 48px;}.ch-head{padding:36px 20px;}
}
@media(max-width:600px){
  body{font-size:18px;}.hero-title{font-size:32px;}
  .toc-grid{grid-template-columns:1fr;}
}

<script>

// 漢堡選單
var sb=document.getElementById('sb'),sbToggle=document.getElementById('sbToggle');
if(sbToggle)sbToggle.addEventListener('click',function(){sb.classList.toggle('open');});

// sb-brand 回頂
var sbBrand=document.getElementById('sbBrand');
if(sbBrand)sbBrand.addEventListener('click',function(e){e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});

// 進度膠囊
var rpFill=document.getElementById('rpFill'),rpPct=document.getElementById('rpPct');
function updateProgress(){
  var sh=document.documentElement.scrollHeight-window.innerHeight;
  var pct=sh>0?Math.min(100,Math.max(0,window.scrollY/sh*100)):0;
  if(rpFill)rpFill.style.width=pct+'%';
  if(rpPct)rpPct.textContent=Math.round(pct)+'%';
}
window.addEventListener('scroll',updateProgress,{passive:true});
updateProgress();

// 回頂按鈕
var backTop=document.getElementById('backTop');
window.addEventListener('scroll',function(){
  if(window.scrollY>600)backTop.classList.add('show');else backTop.classList.remove('show');
},{passive:true});
if(backTop)backTop.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});

// iframe 自動高度
function resizeFrame(f){
  try{
    var d=f.contentDocument||f.contentWindow.document;
    if(!d||!d.body)return;
    d.body.style.minHeight='0';d.body.style.height='auto';
    if(d.documentElement){d.documentElement.style.minHeight='0';d.documentElement.style.height='auto';}
    var h=d.body.scrollHeight;
    if(h>100){f.style.height=h+'px';f.style.minHeight='0';}
  }catch(e){}
}
function resizeAllFrames(){
  document.querySelectorAll('iframe.ch-frame').forEach(resizeFrame);
  if(typeof updateProgress==='function')updateProgress();
}
function setupFrame(f){
  var tries=0;
  function tick(){tries++;resizeFrame(f);if(tries<30)setTimeout(tick,200);}
  if(f.contentDocument&&f.contentDocument.readyState==='complete')tick();
  else f.addEventListener('load',tick);
}
document.querySelectorAll('iframe.ch-frame').forEach(setupFrame);
var rzT;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resizeAllFrames,200);});

// 錨點點擊防錯跳
document.addEventListener('click',function(e){
  var a=e.target;while(a&&a.tagName!=='A')a=a.parentElement;
  if(!a)return;
  var h=a.getAttribute('href');
  if(!h||h.charAt(0)!=='#'||h.length<2)return;
  var id=h.substring(1);var el=document.getElementById(id);
  if(!el)return;
  e.preventDefault();
  resizeAllFrames();
  setTimeout(function(){
    resizeAllFrames();
    var rect=el.getBoundingClientRect();
    var y=window.scrollY+rect.top-20;
    window.scrollTo({top:y,behavior:'smooth'});
    if(sb)sb.classList.remove('open');
  },60);
},true);

// 持續輪詢
var _rt=0,_riv=setInterval(function(){_rt++;resizeAllFrames();if(_rt>50)clearInterval(_riv);},300);

// 側欄高亮
var chapters=Array.prototype.slice.call(document.querySelectorAll('.chapter'));
var sbItems=Array.prototype.slice.call(document.querySelectorAll('.sb-item'));
function highlight(){
  var idx=-1;
  for(var i=0;i<chapters.length;i++){
    if(chapters[i].getBoundingClientRect().top<window.innerHeight*0.35)idx=i;
  }
  sbItems.forEach(function(it,i){it.classList.toggle('active',i===idx);});
}
window.addEventListener('scroll',highlight,{passive:true});
highlight();

// 進度膠囊接近頁尾淡出
(function(){
  var cap=document.getElementById('readProgress');
  if(!cap)return;
  function setHide(on){cap.classList.toggle('hide-near-end',!!on);}
  var targets=[];
  var f1=document.querySelector('[data-wy-notice="v2"]');if(f1)targets.push(f1);
  var f2=document.querySelector('.site-footer');if(f2)targets.push(f2);
  if(!targets.length)return;
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(entries){
      setHide(entries.some(function(e){return e.isIntersecting;}));
    },{root:null,rootMargin:'0px 0px -20px 0px',threshold:0.01});
    targets.forEach(function(t){io.observe(t);});
  }
}());

// 外層防複製
(function(){
  var blk=function(e){e.preventDefault();return false;};
  ['contextmenu','copy','cut','selectstart','dragstart'].forEach(function(ev){
    document.addEventListener(ev,blk,true);
  });
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(e.ctrlKey&&'cCaAsSpPuUxX'.indexOf(k)>=0)blk(e);
    if(k==='F12')blk(e);
    if(e.ctrlKey&&e.shiftKey&&'IJCKijck'.indexOf(k)>=0)blk(e);
  },true);
}());

</script>

<script id="wy-print-intercept">
(function(){
  try{ window.print = function(){}; }catch(e){}
  document.addEventListener("keydown", function(e){
    if((e.metaKey||e.ctrlKey) && (e.key==="p"||e.key==="P"||e.keyCode===80)){
      e.preventDefault(); e.stopPropagation();
      return false;
    }
  }, true);
})();
</script>
<script id="wy-decoder">
(function(){
  if(!window.__wyReady) return;
  var KEY = "wy-dazhidulun-57-v1";
  function _dec(b64){
    try{
      var raw = atob(b64);
      var bytes = new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++){
        bytes[i] = (raw.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length)) & 0xff;
      }
      if(typeof TextDecoder !== "undefined"){
        return new TextDecoder("utf-8").decode(bytes);
      }
      var s = "";
      for(var j=0;j<bytes.length;j++) s += String.fromCharCode(bytes[j]);
      return decodeURIComponent(escape(s));
    }catch(e){ return null; }
  }
  window.__wyReady.then(function(ok){
    if(!ok) return;
    document.querySelectorAll("iframe.ch-frame[data-c]").forEach(function(oldF){
      var decoded = _dec(oldF.getAttribute("data-c"));
      if(!decoded) return;
      var newF = document.createElement("iframe");
      for(var i=0;i<oldF.attributes.length;i++){
        var a = oldF.attributes[i];
        if(a.name === "data-c" || a.name === "srcdoc") continue;
        try{ newF.setAttribute(a.name, a.value); }catch(e){}
      }
      newF.setAttribute("srcdoc", decoded);
      try{ oldF.parentNode.replaceChild(newF, oldF); }catch(e){ return; }
      if(typeof window.setupFrame === "function"){
        try{ window.setupFrame(newF); }catch(e){}
      }
    });
    document.querySelectorAll("[data-wytext]").forEach(function(el){
      var t = _dec(el.getAttribute("data-wytext"));
      if(t === null) return;
      el.innerHTML = t;
      el.removeAttribute("data-wytext");
    });
    if(typeof window.resizeAllFrames === "function"){
      [150, 800, 2000].forEach(function(ms){
        setTimeout(function(){ try{ window.resizeAllFrames(); }catch(e){} }, ms);
      });
    }
  });
})();
</script>
